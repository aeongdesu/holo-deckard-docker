name: dockerhub-readme

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/dockerhub-readme.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme:
    if: vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - id: repo
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          echo "repository=${DOCKERHUB_USERNAME,,}/holo-deckard" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.repo.outputs.repository }}
          short-description: Unofficial SteamOS(holo) Steam Frame ARM64 Docker image
          readme-filepath: README.md
          enable-url-completion: true
