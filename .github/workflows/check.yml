name: check

on:
  # temporary using external cron schedule
  # schedule:
  #  - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: Only handle the build this meta-server branch points at
        type: string
        default: ""
      force:
        description: Rebuild even if the image already exists
        type: boolean
        default: false

concurrency:
  group: check
  cancel-in-progress: false

permissions:
  contents: read

env:
  META_URL: ${{ vars.META_URL || 'https://steamdeck-atomupd.steamos.cloud/meta' }}
  IMAGES_URL: ${{ vars.IMAGES_URL || 'https://steamdeck-images.steamos.cloud/' }}
  USER_AGENT: holo-deckard (+${{ github.server_url }}/${{ github.repository }})

jobs:
  resolve:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      sync: ${{ steps.plan.outputs.sync }}
      has_build: ${{ steps.plan.outputs.has_build }}
      has_sync: ${{ steps.plan.outputs.has_sync }}
      image: ${{ steps.image.outputs.image }}
      mirror_image: ${{ steps.image.outputs.mirror_image }}
      meta_url: ${{ env.META_URL }}
      images_url: ${{ env.IMAGES_URL }}
    steps:
      - uses: actions/checkout@v7

      - id: image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/holo-deckard" >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ "$HAS_DOCKERHUB_TOKEN" = true ]; then
            echo "mirror_image=docker.io/${DOCKERHUB_USERNAME,,}/holo-deckard" >> "$GITHUB_OUTPUT"
          fi

      - id: plan
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          MIRROR_IMAGE: ${{ steps.image.outputs.mirror_image }}
          BRANCH: ${{ inputs.branch }}
          FORCE: ${{ inputs.force }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          args=(--meta-url "$META_URL" --image "$IMAGE" --github-output "$GITHUB_OUTPUT")
          if [ -n "$MIRROR_IMAGE" ]; then args+=(--mirror-image "$MIRROR_IMAGE"); fi
          if [ -n "$BRANCH" ]; then args+=(--branch "$BRANCH"); fi
          if [ "$FORCE" = true ]; then args+=(--force); fi
          python3 scripts/resolve.py "${args[@]}"

  sync:
    needs: resolve
    if: needs.resolve.outputs.has_sync == 'true'
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        if: needs.resolve.outputs.mirror_image != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - env:
          SYNC: ${{ needs.resolve.outputs.sync }}
        run: |
          jq -c '.[]' <<< "$SYNC" | while read -r item; do
            src=$(jq -r .source <<< "$item")
            jq -r '.tags[]' <<< "$item" | while read -r dst; do
              echo "$src -> $dst"
              skopeo copy --all --preserve-digests "docker://$src" "docker://$dst"
            done
          done

  build:
    needs: resolve
    if: needs.resolve.outputs.has_build == 'true'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.build) }}
      max-parallel: 2
      fail-fast: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      buildid: ${{ matrix.buildid }}
      version: ${{ matrix.version }}
      image_branch: ${{ matrix.image_branch }}
      branches: ${{ join(matrix.branches, ',') }}
      update_path: ${{ matrix.update_path }}
      chunks_store_path: ${{ matrix.chunks_store_path }}
      image: ${{ needs.resolve.outputs.image }}
      mirror_image: ${{ needs.resolve.outputs.mirror_image }}
      meta_url: ${{ needs.resolve.outputs.meta_url }}
      images_url: ${{ needs.resolve.outputs.images_url }}
